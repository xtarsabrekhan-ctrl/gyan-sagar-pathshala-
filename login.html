<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Gyan Sagar Pathshala</title>


<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:#eef2f7;

    padding:20px;

}


.login-container{

    width:100%;

    max-width:450px;

    background:white;

    padding:35px;

    border-radius:18px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.15);

}


.logo{

    text-align:center;

    margin-bottom:30px;

}


.logo h1{

    margin:0;

    color:#17375e;

    font-size:28px;

}


.logo p{

    color:#666;

    margin-top:8px;

}


.form-group{

    margin-bottom:18px;

}


label{

    display:block;

    margin-bottom:8px;

    font-weight:bold;

    color:#333;

}


input{

    width:100%;

    padding:14px;

    border:1px solid #ccc;

    border-radius:8px;

    font-size:16px;

    outline:none;

}


input:focus{

    border-color:#245b9b;

}


.login-btn{

    width:100%;

    border:none;

    background:#245b9b;

    color:white;

    padding:15px;

    border-radius:8px;

    font-size:17px;

    cursor:pointer;

}


.login-btn:hover{

    background:#173e6b;

}


.login-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

}


.status{

    display:none;

    margin-top:18px;

    padding:13px;

    border-radius:8px;

    text-align:center;

}


.status.error{

    display:block;

    background:#f8d7da;

    color:#842029;

}


.status.success{

    display:block;

    background:#d1e7dd;

    color:#0f5132;

}


.status.loading{

    display:block;

    background:#cfe2ff;

    color:#084298;

}


.footer{

    text-align:center;

    margin-top:22px;

    color:#777;

    font-size:13px;

}

</style>

</head>


<body>


<div class="login-container">


<div class="logo">

<h1>📚 Gyan Sagar Pathshala</h1>

<p>
Teacher & Student Login Portal
</p>

</div>



<form id="loginForm">


<div class="form-group">

<label>Email ID</label>

<input

type="email"

id="email"

placeholder="Enter your Email ID"

autocomplete="email"

required

>

</div>



<div class="form-group">

<label>Password</label>

<input

type="password"

id="password"

placeholder="Enter your Password"

autocomplete="current-password"

required

>

</div>



<button

type="submit"

class="login-btn"

id="loginButton"

>

🔐 Login

</button>


</form>



<div

id="loginStatus"

class="status"

>

</div>



<div class="footer">

© Gyan Sagar Pathshala

</div>


</div>



<script type="module">


/* =========================================
IMPORT FIREBASE CONFIG
========================================= */

import {

auth,
db

}

from "./firebase-config.js";



/* =========================================
IMPORT FIREBASE AUTH
========================================= */

import {

signInWithEmailAndPassword,
onAuthStateChanged,
signOut

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



/* =========================================
IMPORT FIRESTORE
========================================= */

import {

doc,
getDoc

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



let loginInProgress=false;



/* =========================================
STATUS FUNCTION
========================================= */

function showStatus(message,type){

    const status=

    document
    .getElementById("loginStatus");


    status.innerText=message;


    status.className=

    "status "+type;

}



/* =========================================
OPEN CORRECT DASHBOARD
========================================= */

async function openDashboard(user){


    try{


        const userRef=

        doc(
            db,
            "users",
            user.uid
        );


        const userSnap=

        await getDoc(
            userRef
        );


        if(!userSnap.exists()){


            showStatus(

                "❌ आपका User Profile नहीं मिला। कृपया Admin/Teacher से संपर्क करें।",

                "error"

            );


            return;

        }


        const userData=

        userSnap.data();


        const role=

        userData.role;


        if(role==="teacher"){

            window.location.replace(
                "teacher-dashboard.html"
            );

            return;

        }


        if(role==="student"){

            window.location.replace(
                "student-dashboard.html"
            );

            return;

        }



        showStatus(

            "❌ Account Role सही नहीं है।",

            "error"

        );


    }


    catch(error){


        console.error(
            "Dashboard Error:",
            error
        );


        showStatus(

            "❌ Firebase Error: "+
            error.message,

            "error"

        );


    }


}



/* =========================================
LOGIN FORM
========================================= */

document
.getElementById("loginForm")
.addEventListener(

"submit",

async function(event){


    event.preventDefault();


    const email=

    document
    .getElementById("email")
    .value
    .trim();


    const password=

    document
    .getElementById("password")
    .value;


    const loginButton=

    document
    .getElementById("loginButton");



    if(!email || !password){


        showStatus(

            "❌ Email और Password भरें।",

            "error"

        );


        return;

    }



    loginInProgress=true;


    loginButton.disabled=true;


    loginButton.innerText=

    "⏳ Logging in...";



    showStatus(

        "⏳ Login किया जा रहा है...",

        "loading"

    );



    try{


        const credential=

        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );


        showStatus(

            "✅ Login Successful! Dashboard खोला जा रहा है...",

            "success"

        );


        await openDashboard(

            credential.user

        );


    }


    catch(error){


        console.error(
            "Login Error:",
            error
        );


        let message=

        error.message;



        if(

            error.code===

            "auth/invalid-credential"

        ){

            message=

            "❌ Email या Password गलत है।";

        }


        else if(

            error.code===

            "auth/user-not-found"

        ){

            message=

            "❌ यह Email Registered नहीं है।";

        }


        else if(

            error.code===

            "auth/wrong-password"

        ){

            message=

            "❌ Password गलत है।";

        }


        else if(

            error.code===

            "auth/invalid-email"

        ){

            message=

            "❌ Email सही Format में लिखें।";

        }


        else if(

            error.code===

            "auth/too-many-requests"

        ){

            message=

            "❌ बहुत बार गलत Login किया गया है। बाद में कोशिश करें।";

        }



        showStatus(

            message,

            "error"

        );


    }


    finally{


        loginInProgress=false;


        loginButton.disabled=false;


        loginButton.innerText=

        "🔐 Login";

    }


});


/* =========================================
CHECK EXISTING LOGIN SESSION
========================================= */

onAuthStateChanged(

auth,

async function(user){


    if(loginInProgress){

        return;

    }


    if(user){


        showStatus(

            "⏳ Existing Login Session Check किया जा रहा है...",

            "loading"

        );


        await openDashboard(
            user
        );


    }


});


</script>


</body>

</html>
